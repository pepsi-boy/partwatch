name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Real Postgres and Redis containers, same versions as docker-compose.yml.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: partwatch
          POSTGRES_PASSWORD: partwatch
          POSTGRES_DB: partwatch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U partwatch"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://partwatch:partwatch@localhost:5432/partwatch
      REDIS_URL: redis://localhost:6379/0
      # Empty on purpose: CI must never call the real Best Buy API or send email.
      BESTBUY_API_KEY: ""
      SMTP_USER: ""
      SMTP_PASSWORD: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -v
