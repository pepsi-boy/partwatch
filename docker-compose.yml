services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: partwatch
      POSTGRES_PASSWORD: partwatch
      POSTGRES_DB: partwatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partwatch"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://partwatch:partwatch@postgres:5432/partwatch
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://partwatch:partwatch@postgres:5432/partwatch
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy

  beat:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://partwatch:partwatch@postgres:5432/partwatch
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    # Schedule state goes in /tmp so it isn't written into the mounted source tree.
    command: celery -A app.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      # Server-side fetches go container-to-container; links in the browser use localhost.
      API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      # Keep the container's own node_modules and build cache, not the host's.
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  pgdata:
